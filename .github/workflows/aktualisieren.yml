name: Daten holen und Seite bauen

# Laeuft ungefaehr stuendlich zu einer versetzten Minute (17), statt zu wenigen
# festen Uhrzeiten zu raten, wann ein Modelllauf fertig sein koennte. Jeder
# Durchlauf prueft zuerst nur Metadaten (billig) und laedt volle Ensemble-
# daten nur, wenn tatsaechlich ein neuer, noch nicht vollstaendig gespeicherter
# Lauf vorliegt -- sammeln_vorhersage.py und sammeln.py implementieren diese
# Pruefung selbst und ueberspringen den teuren Teil sonst (siehe dortige
# Kommentare "bereits gespeichert" / "bereits erledigt").
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet requests pytest

      - name: Selbsttests (vor jedem Datenabruf — kein Schreiben auf Basis kaputten Codes)
        run: python3 -m pytest tests/ -q --ignore=tests/test_js_analyse.py

      - name: Ensemble-Meteogrammdaten (Vorhersage-Seite) — nur neue/unvollständige Läufe
        run: python3 skripte/sammeln_vorhersage.py --modell beide

      - name: Tagesgenaue Vorhersage- und Messdaten (Analyse-Seite) — nur falls nötig
        run: python3 skripte/sammeln.py --alles

      - name: Historie der Hauptläufe auffrischen (einmal täglich, gegen 12 UTC)
        if: github.event.schedule == '17 12 * * *' || github.event_name == 'workflow_dispatch'
        run: python3 skripte/historie.py

      - name: Seite bauen
        run: python3 skripte/bauen.py

      - name: Änderungen sichern
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A statt nur "daten docs": sammeln_vorhersage.py raeumt alte
          # Laufdateien nach AUFBEWAHREN auch mal ab (loescht sie) -- ohne -A
          # wuerden Loeschungen von "git add" nicht erfasst und blieben ewig
          # im Arbeitsverzeichnis liegen, ohne je committet zu werden.
          git add -A daten docs
          if git diff --staged --quiet; then
            echo "Nichts verändert."
          else
            git commit -m "Daten ${{ github.event.schedule && 'automatisch' || 'manuell' }} $(date -u '+%Y-%m-%d %H:%MZ')"
            git push
          fi
