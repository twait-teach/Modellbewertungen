name: Daten holen und Seite bauen

# Prueft halbstuendlich zu versetzten Minuten (17/47, alle Zeiten UTC).
# Ein vollstaendiges Ensemble wird sofort in seinem Lauf-Slot gespeichert;
# der exakt passende Hauptlauf wird spaeter aus der Single-Runs-Schnittstelle
# in denselben Slot nachgetragen. Ohne fachlich neue Daten wird weder gebaut noch
# committed (der Abrufzeitpunkt allein gilt nicht als Aenderung).
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet requests pytest

      - name: Schnelle Selbsttests (vor jedem Datenabruf — kein Schreiben auf Basis kaputten Codes)
        # Ohne Browser: Chromium wird hier bewusst nicht installiert. Die
        # Browsertests laufen getrennt im Workflow "Tests" (tests.yml).
        run: >
          python3 -m pytest tests/ -q
          --ignore=tests/test_js_analyse.py
          --ignore=tests/test_vorhersage_darstellung.py
          --ignore=tests/test_48h_browser.py
          --ignore=tests/test_handy_browser.py

      - name: Meteogramm-Slots anlegen und Hauptläufe nachtragen
        run: python3 skripte/sammeln_vorhersage.py --modell beide

      - name: Stundenwerte der nächsten 48 Stunden (Reiter „48h Wetter“)
        # Ein Abruf je Modell, Hauptlauf in Stundenaufloesung samt WMO-Wettercode
        # fuer die Symbole. Schreibt nur bei fachlicher Aenderung.
        run: python3 skripte/sammeln_48h.py --modell beide

      - name: Tagesgenaue Vorhersage- und Messdaten (Analyse-Seite) — nur falls nötig
        run: python3 skripte/sammeln.py --alles

      - name: Historie der Hauptläufe auffrischen (idempotent, ab 12 UTC und nur bei veraltetem Stand)
        # Die Entscheidung liegt in historie.py selbst: vor 12 UTC oder bei
        # aktuellem Feld "stand" in beiden history_*.json passiert nichts.
        # Das gilt auch beim manuellen Start; --erzwingen ist nur fuer
        # bewussten Handbetrieb gedacht und wird hier nicht benutzt.
        run: python3 skripte/historie.py

      - name: Prüfen, ob sich Daten geändert haben
        id: datenstand
        run: |
          if [[ -n "$(git status --porcelain -- daten)" ]]; then
            echo "geaendert=true" >> "$GITHUB_OUTPUT"
          else
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seite bauen
        if: steps.datenstand.outputs.geaendert == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 skripte/bauen.py

      - name: Änderungen sichern
        if: steps.datenstand.outputs.geaendert == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A statt nur "daten docs": sammeln_vorhersage.py raeumt alte
          # Laufdateien nach AUFBEWAHREN auch mal ab (loescht sie) -- ohne -A
          # wuerden Loeschungen von "git add" nicht erfasst und blieben ewig
          # im Arbeitsverzeichnis liegen, ohne je committet zu werden.
          git add -A daten docs
          if git diff --staged --quiet; then
            echo "Nichts verändert."
          else
            git commit -m "Daten ${{ github.event.schedule && 'automatisch' || 'manuell' }} $(date -u '+%Y-%m-%d %H:%MZ')"
            # Bewusst kein Rebase, kein Force-Push und keine automatische
            # Konfliktentscheidung: Wurde inzwischen von anderer Seite gepusht,
            # wird der Push abgelehnt, dieser Lauf schlaegt sichtbar fehl, und
            # der naechste halbstuendliche Lauf beginnt auf dem neuen Stand.
            if ! git push; then
              echo "::error title=Push abgelehnt::Auf main liegen inzwischen neuere Commits (vermutlich ein Entwickler-Push). Es wird weder rebased noch erzwungen. Diese Datenaktualisierung wird verworfen; der naechste geplante Lauf startet automatisch auf dem neuen Stand."
              exit 1
            fi
          fi
