name: Daten holen und Seite bauen

# Prueft halbstuendlich zu versetzten Minuten (17/47, alle Zeiten UTC).
# Ein vollstaendiges Ensemble wird sofort in seinem Lauf-Slot gespeichert;
# der exakt passende Hauptlauf wird spaeter aus der Single-Runs-Schnittstelle
# in denselben Slot nachgetragen. Ohne neue Daten wird weder gebaut noch committed.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet requests pytest

      - name: Selbsttests (vor jedem Datenabruf — kein Schreiben auf Basis kaputten Codes)
        run: python3 -m pytest tests/ -q --ignore=tests/test_js_analyse.py

      - name: Meteogramm-Slots anlegen und Hauptläufe nachtragen
        run: python3 skripte/sammeln_vorhersage.py --modell beide

      - name: Tagesgenaue Vorhersage- und Messdaten (Analyse-Seite) — nur falls nötig
        run: python3 skripte/sammeln.py --alles

      - name: Historie der Hauptläufe auffrischen (einmal täglich, gegen 12 UTC)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u '+%H:%M')" == "12:17" ]]; then
            python3 skripte/historie.py
          else
            echo "Historie ist nur beim 12:17-UTC-Lauf vorgesehen."
          fi

      - name: Prüfen, ob sich Daten geändert haben
        id: datenstand
        run: |
          if [[ -n "$(git status --porcelain -- daten)" ]]; then
            echo "geaendert=true" >> "$GITHUB_OUTPUT"
          else
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seite bauen
        if: steps.datenstand.outputs.geaendert == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 skripte/bauen.py

      - name: Änderungen sichern
        if: steps.datenstand.outputs.geaendert == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A statt nur "daten docs": sammeln_vorhersage.py raeumt alte
          # Laufdateien nach AUFBEWAHREN auch mal ab (loescht sie) -- ohne -A
          # wuerden Loeschungen von "git add" nicht erfasst und blieben ewig
          # im Arbeitsverzeichnis liegen, ohne je committet zu werden.
          git add -A daten docs
          if git diff --staged --quiet; then
            echo "Nichts verändert."
          else
            git commit -m "Daten ${{ github.event.schedule && 'automatisch' || 'manuell' }} $(date -u '+%Y-%m-%d %H:%MZ')"
            git push
          fi
